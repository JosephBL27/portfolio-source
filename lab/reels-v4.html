<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>v4 lab: new reels</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0b0b0c; color: #ECEAE3; font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    #grid { display: grid; gap: 6px; padding: 6px; }
    figure { margin: 0; position: relative; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    figcaption { position: absolute; left: 8px; bottom: 7px; color: #ECEAE3; text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
    body.bare figcaption { display: none; }
    body.bare #grid { padding: 0; gap: 0; }
    body.single #grid { display: block; padding: 0; }
    body.single figure { position: fixed; inset: 0; }
    #log { position: fixed; left: 8px; top: 8px; white-space: pre-wrap; color: #9f9; background: #000a; padding: 6px; max-width: 90vw; z-index: 5; }
    #log:empty { display: none; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <pre id="log"></pre>
  <script type="module" src="./reels-v4.ts"></script>
</body>
</html>
