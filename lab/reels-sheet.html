<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PNEUMA lab: reel contact sheet</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0E0F10; color: #ECEAE3; font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    #grid { display: grid; gap: 6px; padding: 6px; }
    figure { margin: 0; position: relative; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    body.bare figcaption { display: none; }
    body.bare #grid { padding: 0; gap: 0; }
    figcaption { position: absolute; left: 6px; bottom: 5px; color: #ECEAE3; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script type="module" src="./reels-sheet.ts"></script>
</body>
</html>
