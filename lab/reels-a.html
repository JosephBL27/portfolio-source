<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PNEUMA lab: reels A (ember, phase, rings)</title>
  <style>
    :root { --paper:#EEECE6; --paper-raised:#F7F5F0; --ink:#121212; --graphite:#5A5853; --rule:#CBC7BD; --brain:#E0442B; color-scheme: light; }
    :root[data-theme='night'] { --paper:#0E0F10; --paper-raised:#17191B; --ink:#ECEAE3; --graphite:#9A978F; --rule:#2C2E31; --brain:#FF6A4D; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body { font-family: 'Archivo Variable', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .mono { font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    .bar { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center;
      height: 48px; padding: 0 48px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule); }
    .bar .t { display: flex; gap: 8px; }
    button { font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: none;
      border: 1px solid var(--ink); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
    button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
    main { padding: 40px 48px 64px; }
    h1 { margin: 0 0 28px; font-variation-settings: 'wdth' 112; font-weight: 600; font-size: clamp(28px, 3vw, 44px); letter-spacing: -.025em; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, 640px); gap: 32px; justify-content: center; }
    .tile { margin: 0; }
    .tile .screen { position: relative; width: 640px; height: 400px; border-radius: 6px; overflow: hidden; background: #000;
      box-shadow: 0 0 0 1px var(--rule), 0 24px 60px -30px rgba(0,0,0,.8); }
    .tile canvas, .thumb canvas, .full canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .tile .open { position: absolute; right: 12px; bottom: 12px; color: #ECEAE3; border-color: rgba(236,234,227,.55); background: rgba(0,0,0,.35); backdrop-filter: blur(6px); }
    .tile figcaption { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: baseline; padding: 14px 2px 0; }
    .tile figcaption .n { color: var(--graphite); }
    .tile figcaption b { font-variation-settings: 'wdth' 100; font-weight: 600; font-size: 20px; letter-spacing: -.01em; }
    .tile figcaption .m { grid-column: 2 / 4; color: var(--graphite); font-size: 14px; }
    .tile figcaption .pid { color: var(--graphite); }
    .thumbs { display: flex; gap: 24px; justify-content: center; margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--rule); }
    .thumb { margin: 0; }
    .thumb .screen { position: relative; width: 240px; height: 150px; border-radius: 4px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--rule); }
    .thumb figcaption { padding-top: 8px; color: var(--graphite); }
    .full { position: fixed; inset: 0; z-index: 50; background: #000; display: none; }
    .full.on { display: block; }
    .full .hud { position: absolute; left: 32px; bottom: 28px; right: 32px; display: flex; justify-content: space-between; align-items: flex-end; color: #ECEAE3; pointer-events: none; mix-blend-mode: difference; }
    .full .hud b { display: block; font-variation-settings: 'wdth' 100; font-weight: 600; font-size: 28px; letter-spacing: -.015em; text-transform: none; margin-top: 8px; }
    .full .close { position: absolute; right: 24px; top: 20px; color: #ECEAE3; border-color: rgba(236,234,227,.55); background: rgba(0,0,0,.35); }
    body.bare .bar, body.bare main > h1 { display: none; }
  </style>
</head>
<body>
  <div class="bar"><span class="mono">PNEUMA lab · reels A · ember / phase / rings</span>
    <span class="t"><button id="pause" aria-pressed="false">Pause the system</button><button id="night" aria-pressed="true">Night shift</button></span></div>
  <main>
    <h1>Generative reels, first three channels</h1>
    <div class="tiles" id="tiles"></div>
    <div class="thumbs" id="thumbs"></div>
  </main>
  <div class="full" id="full" role="dialog" aria-modal="true" aria-label="Reel, fullscreen">
    <canvas></canvas>
    <button class="close" id="close">Close · Esc</button>
    <div class="hud mono"><span id="hud-l"></span><span id="hud-r">← → to change channel</span></div>
  </div>
  <script type="module" src="./reels-a.ts"></script>
</body>
</html>
