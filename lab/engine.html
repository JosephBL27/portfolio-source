<!doctype html><html><head><meta charset="utf-8"><title>particle engine lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#050506;color:#ede6d6;font:11px/1.5 'IBM Plex Mono',monospace;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#hud{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 14px;background:linear-gradient(transparent,rgba(5,5,6,.85) 40%);display:grid;gap:8px}
#row1,#row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#hud button{background:#111;color:#ede6d6;border:1px solid #333;border-radius:20px;padding:4px 10px;cursor:pointer;font:inherit}
#hud button:hover{border-color:#ede6d6}#hud button.on{background:#ede6d6;color:#050506}
#scrub{flex:1;min-width:240px;accent-color:#ff4a2b}
#label{min-width:230px;text-align:right;opacity:.9}
#stats{position:fixed;left:16px;top:12px;white-space:pre;opacity:.85;pointer-events:none;text-shadow:0 0 6px #000}
#marks{display:flex;flex-wrap:wrap;gap:4px}
.hide #hud,.hide #stats{display:none}
</style></head>
<body><canvas id="c"></canvas><div id="stats"></div>
<div id="hud">
  <div id="row1"><button id="play">play</button><input id="scrub" type="range" min="0" max="1" step="0.0005" value="0"><span id="label"></span></div>
  <div id="row2"><span>turbulence</span><span id="turbs"></span><button id="pause">pause</button><button id="bench">bench all</button><button id="lose">lose ctx</button><span id="marks"></span></div>
</div>
<script type="module" src="./engine.ts"></script></body></html>
