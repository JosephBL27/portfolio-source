<rect x="60" y="60" width="1480" height="880" fill="none" stroke="#17181A" stroke-width="3"/>
<text x="110" y="132" font-family="Menlo, Courier New, monospace" font-size="26" letter-spacing="5" fill="#D2553B">THE DESIGN</text>
<text x="110" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#17181A" letter-spacing="-1.5">A purchase counts once it is checked</text>
<text x="110" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#6B6A64">The outcome is whether each shopper buys anything. Sources are checked in a fixed order.</text><rect x="110" y="360" width="400" height="330" rx="6" fill="none" stroke="#17181A" stroke-width="3"/>
<circle cx="180" cy="440" r="38" fill="#D2553B"/><text x="180" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F2EEE3" text-anchor="middle">1</text>
<text x="146" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#17181A" letter-spacing="-.5">Receipt</text>
<text x="146" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#6B6A64">checked first</text>
<path d="M146 640 H474" stroke="#CFC9B8" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/><path d="M522 525 h56" stroke="#17181A" stroke-width="4" stroke-linecap="round"/><path d="M560 505 l22 20 l-22 20" fill="none" stroke="#17181A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="360" width="400" height="330" rx="6" fill="none" stroke="#17181A" stroke-width="3"/>
<circle cx="660" cy="440" r="38" fill="#D2553B"/><text x="660" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F2EEE3" text-anchor="middle">2</text>
<text x="626" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#17181A" letter-spacing="-.5">Bag inspection</text>
<text x="626" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#6B6A64">if there is no receipt</text>
<path d="M626 640 H954" stroke="#CFC9B8" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/><path d="M1002 525 h56" stroke="#17181A" stroke-width="4" stroke-linecap="round"/><path d="M1040 505 l22 20 l-22 20" fill="none" stroke="#17181A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1070" y="360" width="400" height="330" rx="6" fill="none" stroke="#17181A" stroke-width="3"/>
<circle cx="1140" cy="440" r="38" fill="#D2553B"/><text x="1140" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F2EEE3" text-anchor="middle">3</text>
<text x="1106" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#17181A" letter-spacing="-.5">Matched self-report</text>
<text x="1106" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#6B6A64">a closely matched account, last</text>
<path d="M1106 640 H1434" stroke="#CFC9B8" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/><line x1="110" y1="850" x2="1490" y2="850" stroke="#17181A" stroke-width="2"/>
<text x="110" y="898" font-family="Menlo, Courier New, monospace" font-size="22" letter-spacing="2" fill="#6B6A64">DRAWN FROM THE DESIGN DESCRIBED ON THIS PAGE. NOT A PAGE OF THE MANUSCRIPT. NO RESULTS.</text>
