<rect x="850" y="340" width="640" height="410" rx="6" fill="none" stroke="#17181A" stroke-width="3"/>
<text x="150" y="400" font-family="Menlo, Courier New, monospace" font-size="24" letter-spacing="4" fill="#D2553B">CONDITION A</text>
<text x="150" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#17181A">Browse together</text>
<text x="150" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#6B6A64">as they planned</text>
<text x="890" y="400" font-family="Menlo, Courier New, monospace" font-size="24" letter-spacing="4" fill="#D2553B">CONDITION B</text>
<text x="890" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#17181A">Search apart</text>
<text x="890" y="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#6B6A64">separately, until they meet again at the exit</text>
