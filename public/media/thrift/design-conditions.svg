<text x="110" y="132" font-family="Menlo, Courier New, monospace" font-size="26" letter-spacing="5" fill="#D2553B">THE DESIGN</text>
<text x="110" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#17181A" letter-spacing="-1.5">Two conditions, assigned by chance</text>
<text x="110" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#6B6A64">Adult pairs who arrive together are assigned within each store, date and time block.</text>
